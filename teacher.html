<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="dashboard">
  <h2>👨‍🏫 Teacher Dashboard</h2>

  <input type="text" id="subject" placeholder="Enter Subject Name">

  <button onclick="createLecture()">➕ Create Lecture QR</button>
  <button onclick="viewAttendance()">📊 View Attendance</button>


  <div id="timer"></div>

  <div id="qrBox"></div>

  <button class="logout" onclick="logout()">Logout</button>
</div>

<script type="module" src="js/firebase.js"></script>
<script type="module" src="js/teacher.js"></script>
<script src="js/transitions.js"></script>

<!-- QR Code Library -->
<script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>

</body>
</html>
